<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1890ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#096dd9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGradient)"/>

  <!-- Slack-style icon -->
  <g transform="translate(100, 100)">
    <!-- Left vertical bar -->
    <rect x="20" y="80" width="60" height="140" rx="30" fill="white" opacity="0.9"/>
    <!-- Top horizontal bar -->
    <rect x="80" y="20" width="140" height="60" rx="30" fill="white" opacity="0.9"/>
    <!-- Right vertical bar -->
    <rect x="232" y="92" width="60" height="140" rx="30" fill="white" opacity="0.9"/>
    <!-- Bottom horizontal bar -->
    <rect x="92" y="232" width="140" height="60" rx="30" fill="white" opacity="0.9"/>
  </g>

  <!-- Claude 'C' letter -->
  <text x="256" y="340" font-family="Arial, sans-serif" font-size="180" font-weight="bold" fill="white" text-anchor="middle">C</text>
</svg>
